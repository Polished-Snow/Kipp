name: CI

on:
  push:
  pull_request:
  # A weekly run catches toolchain and runner-image drift on a repository whose
  # correctness claims rest on compiler and GPU behaviour.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux CPU and tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Unit and generated-file checks
        run: make test
      - name: Sanitizers
        run: make test-sanitize
      - name: CPU binaries
        run: make cpu server
      - name: Whitespace
        run: git diff --check

  macos:
    name: macOS build and Metal operators
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: CPU and Metal binaries
        run: make cpu server metal server-metal
      # The unit binary builds without the Python tooling, so macOS can run the
      # hermetic suite without pulling a multi-gigabyte environment; the Linux
      # job already covers the tooling and docs-drift checks.
      - name: Hermetic unit tests
        run: |
          make build/kipp_test
          build/kipp_test
      # Model-free Metal kernel comparisons. This is the only place CI actually
      # executes a GPU kernel: a reserved-keyword typo once disabled every
      # simdgroup-matrix kernel for two days while every gate still passed,
      # because nothing in CI ran Metal at all. Not marked required until the
      # runner image is confirmed to expose a Metal device on every run.
      - name: Metal operator tests
        id: metal_operators
        continue-on-error: true
        run: |
          make build/kipp_test_metal
          build/kipp_test_metal --metal-operators
      - name: Report Metal operator outcome
        run: |
          if [ "${{ steps.metal_operators.outcome }}" = "success" ]; then
            echo "Metal operator tests passed on this runner."
          else
            echo "::warning::Metal operator tests did not pass on this runner;"\
                 "this step is advisory until GPU availability is confirmed."
          fi
